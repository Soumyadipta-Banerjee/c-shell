name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-build-and-test:
    name: Build & Test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with strict warnings (-Werror)
        run: |
          make clean
          make all test-unit CC=${{ matrix.cc }} CFLAGS="-Wall -Wextra -pedantic -Werror -std=c99 -O2 -Iinclude"

      - name: Run C unit test suite
        run: make test-unit CC=${{ matrix.cc }}

      - name: Run integration test suite
        run: make test CC=${{ matrix.cc }}

  sanitizers:
    name: Memory Safety & Leaks (ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and verify zero memory leaks across test battery
        run: make test-asan
